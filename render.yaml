services:
  - type: web
    name: railvision-command-center
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_PASSWORD
        sync: false   # Set the actual value in the Render dashboard — never commit it here
